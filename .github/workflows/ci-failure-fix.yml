name: Jules CI Failure Fixer
on:
  workflow_run:
    workflows: ["CI Build & Test"] # Change this if your main test/build workflow has a different name
    types: [completed]

jobs:
  fix-ci:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Jules CI Recovery Agent
        uses: google-labs-code/jules-action@v1
        with:
          prompt: "The main CI pipeline just failed. Inspect the codebase, look for typical build breaker issues like syntax errors, missing imports, or failing test assertions, and attempt to resolve them."
          jules_api_key: ${{ secrets.JULES_API_KEY }}
