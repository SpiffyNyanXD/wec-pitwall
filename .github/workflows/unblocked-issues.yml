name: Jules Unblocked Issue Processor
on:
  issues:
    types: [closed]

jobs:
  process-unblocked:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Jules Unblocking Agent
        uses: google-labs-code/jules-action@v1
        with:
          prompt: "Issue #${{ github.event.issue.number }} has been closed. Look through remaining open issues to see if any contain text indicating they were blocked by or waiting on this issue. Choose the highest priority unblocked issue and start implementing the feature or fix requested."
          jules_api_key: ${{ secrets.JULES_API_KEY }}
