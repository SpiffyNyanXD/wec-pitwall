name: Jules AI Agent Task
on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'What would you like Jules to work on?'
        required: true
        default: 'Review the codebase and identify any unused variables or components.'

jobs:
  jules-task:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Invoke Jules Agent
        uses: google-labs-code/jules-action@v1
        with:
          prompt: ${{ github.event.inputs.prompt }}
          jules_api_key: ${{ secrets.JULES_API_KEY }}
