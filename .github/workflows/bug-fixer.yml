name: Jules Bug Fixer
on:
  issues:
    types: [labeled]

jobs:
  fix-bug:
    if: github.event.label.name == 'bug'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Jules Bug Fixer Agent
        uses: google-labs-code/jules-action@v1
        with:
          prompt: "Read the following issue titled '${{ github.event.issue.title }}'. Description: ${{ github.event.issue.body }}. Investigate the relevant files in the codebase, write a fix, and open a PR linking back to this issue."
          jules_api_key: ${{ secrets.JULES_API_KEY }}
