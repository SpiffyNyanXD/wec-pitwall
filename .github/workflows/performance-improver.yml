name: Jules Performance Improver
on:
  schedule:
    - cron: '0 0 * * *' # Every day at midnight UTC

jobs:
  optimize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Jules Performance Agent
        uses: google-labs-code/jules-action@v1
        with:
          prompt: "Analyze our React/Next.js components and hooks for performance bottlenecks (like missing useMemo/useCallback hooks or heavy re-renders). Apply optimizations where beneficial."
          jules_api_key: ${{ secrets.JULES_API_KEY }}
